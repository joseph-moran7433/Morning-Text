name: Daily Morning Text

on:
  schedule:
    # 09:30 UTC = 5:30am EDT (summer) / 4:30am EST (winter).
    # GitHub Actions cron is always UTC and does NOT auto-adjust for
    # daylight saving -- shift this by 1 hour when DST changes if you
    # want the exact same local send time year-round.
    - cron: "30 9 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually for a live demo

jobs:
  send-advisory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run advisory script
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python advisory.py
